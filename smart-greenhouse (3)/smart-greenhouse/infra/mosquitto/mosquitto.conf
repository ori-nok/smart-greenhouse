# Учебная конфигурация: анонимный доступ только внутри docker-сети/локально.
# Для реального развёртывания включите password_file и TLS (см. README, раздел «Безопасность»).
persistence true
persistence_location /mosquitto/data/
listener 1883
allow_anonymous true
max_queued_messages 1000
log_dest stdout
