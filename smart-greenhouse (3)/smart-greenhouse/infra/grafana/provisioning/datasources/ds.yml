apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: TimescaleDB
    uid: tsdb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: greenhouse
    jsonData:
      database: greenhouse
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
