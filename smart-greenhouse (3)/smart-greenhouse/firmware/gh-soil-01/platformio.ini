; Сборка узла gh-soil-01 для Wokwi в VS Code (расширения PlatformIO IDE и Wokwi Simulator).
; Весь код лежит прямо в этой папке: sketch.ino + gh_common.h + gh_logic.h.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/> -<.vscode/>
lib_deps =
    knolleary/PubSubClient@2.8
